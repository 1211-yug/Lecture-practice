<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Image slider</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.cycle/3.0.3/jquery.cycle.all.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
</head>
<body>
    
    <div id="container">
        <h1>Traveler</h1>
        <div class="slider">
            <img src="image/image-1.jpg" width="640" height="425">
            <img src="image/image-2.jpg" width="640" height="425">
            <img src="image/image-3.jpg" width="640" height="425">
            <img src="image/image-4.jpg" width="640" height="425">
            <img src="image/image-5.jpg" width="640" height="425">
            <img src="image/image-6.jpg" width="640" height="425">
        </div>

        <ul id="nav">
            <li id="prev"><a href="#"><i class="fa-solid fa-caret-left"></i></a></li>
            <li id="next"><a href="#"><i class="fa-solid fa-caret-right"></i></a></li>
        </ul>

    </div>

    <script src="script.js"></script>
</body>
</html>
