<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop watch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bold;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        .container {
            width: 500px;
            background: #181818;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            color: white;
            border: 2px solid #00ffff;
            box-shadow: 0 0 25px rgb(0, 255, 255);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .stopwatch {
            font-size: 50px;
            letter-spacing: 7px;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            color: white;
            transition: .3s;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 10px rgb(0, 255, 255);
        }

        .start {
            border: 2px solid rgb(4, 255, 4);
            background: green;
        }

        .stop {
            border: 2px solid rgb(255, 230, 0);
            background: red;
        }

        .reset {
            border: 2px solid rgb(255, 0, 64);
            background: royalblue;
        }

        @media(max-width:576px) {
            .container {
                width: 90%;
            }

            .stopwatch {
                font-size: 30px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>StopWatch</h1>

        <div class="stopwatch">
            <span id="hours">00</span>
            <span>:</span>
            <span id="minutes">00</span>
            <span>:</span>
            <span id="seconds">00</span>
        </div>

        <div class="btn-group">
            <button class="start" id="startBtn" onclick="start()">Start</button>
            <button class="stop" id="stopBtn" onclick="stop()">Stop</button>
            <button class="reset" id="resetBtn" onclick="reset()">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
