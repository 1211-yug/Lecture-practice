<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Practice</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <form id="productForm">
            <h2>Add Product</h2>
            <input type="text" id="title" placeholder="Enter product title">
            <input type="url" id="image" placeholder="Enter product image URL">
            <input type="number" id="price" placeholder="Enter product price">
            <input type="text" id="desc" placeholder="Enter product description">
            <div class="button">
                <button type="submit" id="add">Add</button>
            </div>
        </form>

        <div id="output"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
