<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1818d6;
background: linear-gradient(205deg, rgba(24, 24, 214, 1) 35%, rgba(0, 212, 255, 1) 100%);
            overflow: hidden;
        }

        h1 {
            color: #ff5733;
            margin-top: 50px;
        }

        .loginBox {
            position: relative;
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
        }

        .loginBox h2 {
            color: #fff;
            text-align: center;
            letter-spacing: 2px;
            font-size: 32px;
            margin-bottom: 30px;
        }
        
        .inputBox input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            outline: none;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .inputBox input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #ff0047;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: #2196f3;
            color: #fff;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="loginBox">

        <h2>Register Form</h2>

        <form action="">

            <div class="inputBox">
                <input type="text" placeholder="name">
            </div>
            
            <div class="inputBox">
                <input type="tel" placeholder="number">
            </div>

            <div class="inputBox">
                <input type="text" placeholder="username">
            </div>
            
            <div class="inputBox">
                <input type="password" placeholder="password">
            </div>

            <button type="submit" class="btn">Submit</button>

        </form>
    </div>

</body>

</html>
